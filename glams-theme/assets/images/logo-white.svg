<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" fill="none" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <filter id="white-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Emblem on Left with White Circular Shell (Preserves authentic brand emblem) -->
  <g transform="translate(10, 5)" filter="url(#white-glow)">
    <!-- White Circular Badge Background -->
    <circle cx="55" cy="55" r="50" fill="#FFFFFF" />

    <!-- Outer Ring (Jet Black) -->
    <circle cx="55" cy="55" r="48" stroke="#0F172A" stroke-width="6" fill="none" />

    <!-- Inner Accent Ring / Arc (UAE Vibrant Green) -->
    <circle cx="55" cy="55" r="41" stroke="#00843D" stroke-width="4.5" fill="none" />

    <!-- Top Wrench Tool Icon (Jet Black with UAE Green Tip) -->
    <g transform="translate(55, 27)">
      <line x1="-16" y1="0" x2="14" y2="0" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />
      <line x1="16" y1="0" x2="19" y2="0" stroke="#00843D" stroke-width="4.5" stroke-linecap="round" />
      <path d="M -13 -6 C -18 -6 -23 -1 -23 0 C -23 1 -18 6 -13 6 C -16 4 -16 -4 -13 -6 Z" fill="#0F172A" />
    </g>

    <!-- Center Monogram: M (Green), H (Black), K (Green) -->
    <text x="20" y="68" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="31" fill="#00843D">M</text>
    <text x="47" y="68" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="31" fill="#0F172A">H</text>
    <text x="71" y="68" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="31" fill="#00843D">K</text>

    <!-- Bottom Text inside emblem: TECHNICAL SERVICES -->
    <text x="55" y="87" font-family="'Inter', sans-serif" font-weight="900" font-size="8.5" fill="#0F172A" text-anchor="middle" letter-spacing="1.2">TECHNICAL</text>
    <text x="55" y="97" font-family="'Inter', sans-serif" font-weight="900" font-size="7.5" fill="#0F172A" text-anchor="middle" letter-spacing="1.4">SERVICES</text>
  </g>

  <!-- Typography Brand Identity on the Right (Pure White & Gold for dark backgrounds) -->
  <g transform="translate(132, 22)">
    <text x="0" y="32" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">MHK <tspan fill="#34D399">TECHNICAL</tspan></text>
    <text x="2" y="54" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#D4A64A" letter-spacing="2.8">SERVICES · UAE</text>
    <rect x="2" y="64" width="48" height="3" rx="1.5" fill="#D4A64A" />
    <text x="58" y="67" font-family="'Inter', sans-serif" font-weight="600" font-size="9.5" fill="#E2E8F0" letter-spacing="0.4">Certified Contracting &amp; Maintenance</text>
  </g>
</svg>
